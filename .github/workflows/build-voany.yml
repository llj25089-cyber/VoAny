          data = base64.b64decode("".join(payload.split()), validate=True)
          if hashlib.sha256(data).hexdigest() != "35fad6568e4a14caeaf987f72835875eff3e4224b64ecb02de6191f61faaef42":
              raise SystemExit("Embedded receive patch checksum mismatch")
          destination = Path(os.environ["RUNNER_TEMP"]) / "voany-sms-v6"
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Embedded ZIP CRC mismatch")
              if sum(member.file_size for member in archive.infolist()) > 10 * 1024 * 1024:
                  raise SystemExit("Embedded ZIP exceeds expected size")
              for member in archive.infolist():
                  if not (destination / member.filename).resolve().is_relative_to(destination.resolve()):
                      raise SystemExit("Unsafe embedded ZIP path")
              archive.extractall(destination)
          installer = destination / "VoAny_SMS_receive_patch_v6" / "apply_sms_fix.py"
          subprocess.run([sys.executable, str(installer), "--repo", os.environ["GITHUB_WORKSPACE"]], check=True)

      - name: Verify standalone SMS regressions
        run: |
          python3 "$RUNNER_TEMP/voany-sms-v6/VoAny_SMS_receive_patch_v6/tests/run_tests.py"             --repo "$GITHUB_WORKSPACE"

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'true'
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore official Gradle 8.11.1 wrapper JAR
        run: |
          curl --fail --location --retry 3 \
            --output gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar"

          printf '%s  %s\n' \
            '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046' \
            'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make perl jq curl git ca-certificates

      - name: Prepare pinned upstream sources
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            flex bison gperf libgmp-dev

          python VoAnyLib/prepare-upstreams.py

          (
            cd VoAnyLib/.upstream/strongswan
            ./autogen.sh
            ./configure
            make dist
          )

          test -s VoAnyLib/.upstream/strongswan/Android.common.mk
          test -s VoAnyLib/.upstream/strongswan/src/libstrongswan/crypto/proposal/proposal_keywords_static.c
          test -s VoAnyLib/.upstream/strongswan/src/libstrongswan/settings/settings_parser.c
          test -s VoAnyLib/.upstream/strongswan/src/libstrongswan/settings/settings_lexer.c

      - name: Build OpenSSL for Android arm64
        run: |
          openssl_archive="$RUNNER_TEMP/openssl-${OPENSSL_VERSION}.tar.gz"

          curl --fail --location --retry 3 \
            --output "$openssl_archive" \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"

          printf '%s  %s\n' \
            "$OPENSSL_SHA256" \
            "$openssl_archive" | sha256sum --check --strict

          tar -xzf "$openssl_archive" -C "$RUNNER_TEMP"

          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${NDK_VERSION}"
          export OPENSSL_SRC="$RUNNER_TEMP/openssl-${OPENSSL_VERSION}"

          bash VoAnyLib/native/build-openssl.sh

          test -s VoAnyLib/src/main/jni/openssl/arm64-v8a/libcrypto.a
          test -f VoAnyLib/src/main/jni/openssl/include/openssl/opensslv.h
          test -f VoAnyLib/src/main/jni/openssl/Android.mk

      - name: Run Java tests and build update APK
        run: |
          ./gradlew :VoAnyLib:testDebugUnitTest :VoAnyApp:assembleDebug --stacktrace
          mkdir -p dist-apk
          shopt -s nullglob
          apks=(VoAnyApp/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" dist-apk/VoAny-v6-update.apk

      - name: Build parallel-install APK to preserve the old app
        run: |
          ./gradlew :VoAnyApp:assembleDebug -PvoanyParallelInstall=true --stacktrace
          shopt -s nullglob
          apks=(VoAnyApp/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" dist-apk/VoAny-v6-keep-old.apk

      - name: Verify APK identities and signatures
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose dist-apk/VoAny-v6-update.apk
          "$tools/apksigner" verify --verbose dist-apk/VoAny-v6-keep-old.apk
          "$tools/aapt" dump badging dist-apk/VoAny-v6-update.apk > "$RUNNER_TEMP/update.badging"
          "$tools/aapt" dump badging dist-apk/VoAny-v6-keep-old.apk > "$RUNNER_TEMP/parallel.badging"
          grep -F "package: name='li.power.app.voany'" "$RUNNER_TEMP/update.badging"
          grep -F "package: name='li.power.app.voany.smsfix'" "$RUNNER_TEMP/parallel.badging"
          grep -F "versionName='0.2.0-sms-v6'" "$RUNNER_TEMP/parallel.badging"
          grep -F "application-label:'VoAny 修复版 v6'" "$RUNNER_TEMP/parallel.badging"
          cp "$RUNNER_TEMP/voany-sms-v6/VoAny_SMS_receive_patch_v6/README.md" dist-apk/INSTALL.md
          (cd dist-apk && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload debug APKs v6
        uses: actions/upload-artifact@v4
        with:
          name: voany-debug-apk-v6
          path: dist-apk/*
          if-no-files-found: error
