          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              archive.extractall(destination)
          installer = destination / "VoAny_SMS_receive_patch_v5" / "apply_sms_fix.py"
          subprocess.run([sys.executable, str(installer), "--repo", os.environ["GITHUB_WORKSPACE"]], check=True)

      - name: Verify standalone SMS regressions
        run: |
          python3 "$RUNNER_TEMP/voany-sms-v5/VoAny_SMS_receive_patch_v5/tests/run_tests.py"             --repo "$GITHUB_WORKSPACE"

      - name: Run Java tests and build debug APK
        run: ./gradlew :VoAnyLib:testDebugUnitTest :VoAnyApp:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voany-debug-apk
          path: VoAnyApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
