name: Build VoAny Debug APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    env:
      NDK_VERSION: '27.1.12297006'
      OPENSSL_VERSION: '3.5.4'
      OPENSSL_SHA256: '967311f84955316969bdb1d8d4b983718ef42338639c621ec4c34fddef355e99'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'true'
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore official Gradle 8.11.1 wrapper JAR
        run: |
          curl --fail --location --retry 3 \
            --output gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar"

          printf '%s  %s\n' \
            '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046' \
            'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make perl jq curl git ca-certificates

      - name: Prepare pinned upstream sources
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            flex bison gperf libgmp-dev

          python VoAnyLib/prepare-upstreams.py

          (
            cd VoAnyLib/.upstream/strongswan
            ./autogen.sh
            ./configure
            make dist
          )

          test -s VoAnyLib/.upstream/strongswan/Android.common.mk
          test -s VoAnyLib/.upstream/strongswan/src/libstrongswan/crypto/proposal/proposal_keywords_static.c
          test -s VoAnyLib/.upstream/strongswan/src/libstrongswan/settings/settings_parser.c
          test -s VoAnyLib/.upstream/strongswan/src/libstrongswan/settings/settings_lexer.c

      - name: Build OpenSSL for Android arm64
        run: |
          openssl_archive="$RUNNER_TEMP/openssl-${OPENSSL_VERSION}.tar.gz"

          curl --fail --location --retry 3 \
            --output "$openssl_archive" \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"

          printf '%s  %s\n' \
            "$OPENSSL_SHA256" \
            "$openssl_archive" | sha256sum --check --strict

          tar -xzf "$openssl_archive" -C "$RUNNER_TEMP"

          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${NDK_VERSION}"
          export OPENSSL_SRC="$RUNNER_TEMP/openssl-${OPENSSL_VERSION}"

          bash VoAnyLib/native/build-openssl.sh

          test -s VoAnyLib/src/main/jni/openssl/arm64-v8a/libcrypto.a
          test -f VoAnyLib/src/main/jni/openssl/include/openssl/opensslv.h
          test -f VoAnyLib/src/main/jni/openssl/Android.mk

      - name: Apply VoAny SMS receive patch v3
        run: |
          unzip -q -o \
            "$GITHUB_WORKSPACE/VoAny_SMS_receive_patch_v3.zip" \
            -d "$RUNNER_TEMP/voany-sms-v3"

          python3 \
            "$RUNNER_TEMP/voany-sms-v3/VoAny_SMS_receive_patch_v3/apply_sms_fix.py" \
            --repo "$GITHUB_WORKSPACE"

      - name: Build debug APK
        run: ./gradlew :VoAnyApp:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voany-debug-apk
          path: VoAnyApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
